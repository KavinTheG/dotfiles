[window]
	opacity = 0.75
	padding = { x = 10, y = 10 } 

[font]
	size = 11.5 

[font.normal]
	family = "Fira Code"
	style = "Medium"

[font.bold]
	family = "Fira Code"
	style = "Bold"

[font.italic]
	family = "Fira Code"
	style = "Italic"

[cursor]
	style = { shape = "Beam", blinking = "On"}

[colors.primary]
	background = "#000505"

[env]
	TERM = "xterm-256color"
